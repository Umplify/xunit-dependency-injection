name: Auto Assign
on:
  issues:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: 'Auto-assign issue'
      # Pinned to the commit the v1 tag resolves to (2021-09-01). Mutable tags can be
      # repointed by the action owner or an attacker who gains access to that repo.
      uses: pozil/auto-assign-issue@d11e715efc663fe323c3d8d4d3cbbfdddd539baf # v1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Arash-Sabet
          numOfAssignee: 1
